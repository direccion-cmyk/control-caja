<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Control de Caja</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --verde: #2d6a4f;
    --verde-light: #d8f3dc;
    --verde-mid: #74c69d;
    --rojo: #9d2b2b;
    --rojo-light: #fde8e8;
    --rojo-mid: #e57373;
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e0ded8;
    --text: #1a1a18;
    --text-muted: #7a7870;
    --accent: #2d6a4f;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --radius: 10px;
    --radius-lg: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* LOGIN */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }

  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2.5rem 2rem;
    width: 340px;
    text-align: center;
  }

  .login-icon {
    width: 56px; height: 56px;
    background: var(--verde-light);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.25rem;
    font-size: 26px;
  }

  .login-box h1 {
    font-size: 20px; font-weight: 500; margin-bottom: 4px;
  }

  .login-box p {
    font-size: 13px; color: var(--text-muted); margin-bottom: 1.5rem;
  }

  .login-box input {
    width: 100%;
    padding: 10px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 15px;
    background: var(--bg);
    color: var(--text);
    margin-bottom: 10px;
    letter-spacing: 0.1em;
    text-align: center;
  }

  .login-box input:focus { outline: 2px solid var(--verde-mid); border-color: transparent; }

  .btn-login {
    width: 100%;
    padding: 10px;
    background: var(--verde);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity .2s;
  }
  .btn-login:hover { opacity: .88; }

  .login-error {
    font-size: 12px;
    color: var(--rojo);
    margin-top: 8px;
    display: none;
  }

  /* APP */
  #app { display: none; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-logo {
    width: 34px; height: 34px;
    background: var(--verde-light);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  header h1 { font-size: 16px; font-weight: 500; }
  header p { font-size: 12px; color: var(--text-muted); }

  .header-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-muted);
    font-family: var(--mono);
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--verde-mid);
  }
  .dot.err { background: var(--rojo-mid); }
  .dot.loading { background: #f0c040; animation: blink 1s infinite; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  /* MÉTRICAS */
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 2rem;
  }

  .metric {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.1rem 1.25rem;
  }

  .metric label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    display: block;
    margin-bottom: 6px;
  }

  .metric .val {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 500;
  }

  .metric.saldo .val { color: var(--verde); }
  .metric.retiros .val { color: var(--rojo); }
  .metric .sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; font-family: var(--mono); }

  /* FORMULARIO */
  .section-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .07em;
    margin-bottom: 10px;
  }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    margin-bottom: 2rem;
  }

  .tipo-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }

  .tipo-btn {
    padding: 9px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all .15s;
  }

  .tipo-btn.active-r {
    background: var(--rojo-light);
    color: var(--rojo);
    border-color: var(--rojo-mid);
  }

  .tipo-btn.active-i {
    background: var(--verde-light);
    color: var(--verde);
    border-color: var(--verde-mid);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  .field label {
    font-size: 11px;
    color: var(--text-muted);
    display: block;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }

  .field input, .field textarea {
    width: 100%;
    padding: 9px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
  }

  .field input:focus, .field textarea:focus {
    outline: 2px solid var(--verde-mid);
    border-color: transparent;
  }

  .img-drop {
    width: 100%;
    height: 80px;
    border-radius: var(--radius);
    border: 1.5px dashed var(--border);
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 4px;
    cursor: pointer;
    overflow: hidden;
    transition: border-color .15s;
  }

  .img-drop:hover { border-color: var(--verde-mid); }
  .img-drop span { font-size: 12px; color: var(--text-muted); }
  .img-drop img { width: 100%; height: 100%; object-fit: cover; }
  .img-drop svg { opacity: .4; }

  .btn-registrar {
    width: 100%;
    padding: 11px;
    background: var(--verde);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: opacity .2s;
    margin-top: 4px;
  }

  .btn-registrar:hover { opacity: .88; }
  .btn-registrar:disabled { opacity: .5; cursor: not-allowed; }

  /* HISTORIAL */
  .historial { display: flex; flex-direction: column; gap: 8px; }

  .mov {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.1rem;
    display: grid;
    grid-template-columns: 38px 1fr auto;
    gap: 12px;
    align-items: start;
    animation: fadeIn .25s ease;
  }

  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

  .mov.retiro { border-left: 3px solid var(--rojo-mid); border-radius: 0 var(--radius-lg) var(--radius-lg) 0; }
  .mov.ingreso { border-left: 3px solid var(--verde-mid); border-radius: 0 var(--radius-lg) var(--radius-lg) 0; }

  .mov-ico {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
  }

  .mov-ico.r { background: var(--rojo-light); }
  .mov-ico.i { background: var(--verde-light); }

  .mov-concepto { font-size: 14px; font-weight: 500; }
  .mov-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .mov-saldo { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-family: var(--mono); }

  .mov-right { text-align: right; }
  .mov-monto { font-family: var(--mono); font-size: 15px; font-weight: 500; }
  .mov-monto.r { color: var(--rojo); }
  .mov-monto.i { color: var(--verde); }

  .mov-thumb {
    width: 38px; height: 38px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    margin-top: 6px;
    display: block;
    margin-left: auto;
    transition: transform .15s;
  }
  .mov-thumb:hover { transform: scale(1.06); }

  .btn-del {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 15px;
    padding: 2px;
    margin-top: 6px;
    display: block;
    margin-left: auto;
    transition: color .15s;
  }
  .btn-del:hover { color: var(--rojo); }

  .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-muted);
    font-size: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
  }

  .empty-icon { font-size: 32px; display: block; margin-bottom: 10px; opacity: .4; }

  /* MODAL FOTO */
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal-bg img {
    max-width: 92vw;
    max-height: 85vh;
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--text);
    color: #fff;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: var(--radius);
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    font-family: var(--mono);
    z-index: 200;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 600px) {
    .metrics { grid-template-columns: 1fr 1fr; }
    .metrics .metric:last-child { grid-column: span 2; }
    .form-grid { grid-template-columns: 1fr; }
    main { padding: 1rem; }
    header { padding: 0 1rem; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-icon">💰</div>
    <h1>Control de Caja</h1>
    <p>Ingresa tu clave para acceder</p>
    <input type="password" id="inp-clave" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()" />
    <button class="btn-login" onclick="login()">Entrar</button>
    <div class="login-error" id="login-error">Clave incorrecta. Intenta de nuevo.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-left">
      <div class="header-logo">💰</div>
      <div>
        <h1>Control de Caja</h1>
        <p>Flujo de efectivo</p>
      </div>
    </div>
    <div class="header-status">
      <div class="dot loading" id="dot"></div>
      <span id="status-txt">Conectando...</span>
    </div>
  </header>

  <main>
    <!-- MÉTRICAS -->
    <div class="metrics">
      <div class="metric saldo">
        <label>Saldo actual</label>
        <div class="val" id="met-saldo">$0.00</div>
        <div class="sub" id="met-movs">0 movimientos</div>
      </div>
      <div class="metric">
        <label>Total ingresos</label>
        <div class="val" id="met-ingresos">$0.00</div>
      </div>
      <div class="metric retiros">
        <label>Total retiros</label>
        <div class="val" id="met-retiros">$0.00</div>
      </div>
    </div>

    <!-- FORMULARIO -->
    <div class="section-label">Nuevo movimiento</div>
    <div class="form-card">
      <div class="tipo-selector">
        <button class="tipo-btn active-r" id="btn-retiro" onclick="setTipo('retiro')">↑ Retiro</button>
        <button class="tipo-btn" id="btn-ingreso" onclick="setTipo('ingreso')">↓ Ingreso</button>
      </div>

      <div class="form-grid">
        <div class="field">
          <label>Cantidad ($)</label>
          <input type="number" id="inp-monto" placeholder="0.00" min="0" step="0.01" />
        </div>
        <div class="field">
          <label>Concepto</label>
          <input type="text" id="inp-concepto" placeholder="¿Para qué es?" />
        </div>
        <div class="field">
          <label>Responsable</label>
          <input type="text" id="inp-resp" placeholder="Nombre de quien retira" />
        </div>
        <div class="field">
          <label>Fecha y hora</label>
          <input type="datetime-local" id="inp-fecha" />
        </div>
      </div>

      <div class="field" style="margin-bottom:14px;">
        <label>Foto de la caja (opcional)</label>
        <div class="img-drop" id="img-drop" onclick="document.getElementById('inp-img').click()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span>Clic para añadir foto</span>
        </div>
        <input type="file" id="inp-img" accept="image/*" style="display:none" onchange="previewImg(this)" />
      </div>

      <button class="btn-registrar" id="btn-registrar" onclick="agregar()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Registrar movimiento
      </button>
    </div>

    <!-- HISTORIAL -->
    <div class="section-label">Historial de movimientos</div>
    <div class="historial" id="historial">
      <div class="empty"><span class="empty-icon">📋</span>Cargando historial...</div>
    </div>
  </main>
</div>

<!-- MODAL FOTO -->
<div class="modal-bg" id="modal-bg" onclick="this.classList.remove('open')">
  <img id="modal-img" src="" alt="Foto de caja" />
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyCOvPcz54LB3GKVAREEsY2YBI2nt4PI5NWHwXhmOuvxZ16MfCw7w2-5ZtZd4v52h1F/exec';
const CLAVE_CORRECTA = 'popo';

let movimientos = [];
let tipoActual = 'retiro';
let imgBase64 = null;
let autenticado = false;

function login() {
  const val = document.getElementById('inp-clave').value;
  if (val === CLAVE_CORRECTA) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    autenticado = true;
    initFecha();
    cargarDatos();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('inp-clave').value = '';
  }
}

function initFecha() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('inp-fecha').value =
    `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

function setStatus(tipo, msg) {
  const dot = document.getElementById('dot');
  document.getElementById('status-txt').textContent = msg;
  dot.className = 'dot' + (tipo === 'ok' ? '' : tipo === 'err' ? ' err' : ' loading');
}

function fmt(n) {
  return '$' + parseFloat(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function recalcular() {
  let saldo = 0, ingresos = 0, retiros = 0;
  movimientos.forEach(m => {
    const monto = parseFloat(m.monto) || 0;
    if (m.tipo === 'ingreso') { saldo += monto; ingresos += monto; }
    else { saldo -= monto; retiros += monto; }
  });
  document.getElementById('met-saldo').textContent = fmt(saldo);
  document.getElementById('met-ingresos').textContent = fmt(ingresos);
  document.getElementById('met-retiros').textContent = fmt(retiros);
  document.getElementById('met-movs').textContent = `${movimientos.length} movimiento(s)`;
}

async function cargarDatos() {
  setStatus('loading', 'Cargando...');
  try {
    const res = await fetch(`${API_URL}?action=getAll&clave=${CLAVE_CORRECTA}`);
    const json = await res.json();
    if (json.ok) {
      movimientos = json.data || [];
      movimientos.sort((a, b) => Number(b.id) - Number(a.id));
      renderHistorial();
      recalcular();
      setStatus('ok', `Sincronizado · ${movimientos.length} registro(s)`);
    } else {
      setStatus('err', 'Error al cargar');
    }
  } catch(e) {
    setStatus('err', 'Sin conexión');
    renderHistorial();
  }
}

function setTipo(t) {
  tipoActual = t;
  document.getElementById('btn-retiro').className = 'tipo-btn' + (t === 'retiro' ? ' active-r' : '');
  document.getElementById('btn-ingreso').className = 'tipo-btn' + (t === 'ingreso' ? ' active-i' : '');
}

function previewImg(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 800000) {
    const reader = new FileReader();
    reader.onload = e => comprimirImagen(e.target.result, 0.5);
    reader.readAsDataURL(file);
  } else {
    const reader = new FileReader();
    reader.onload = e => {
      imgBase64 = e.target.result;
      mostrarPreview(imgBase64);
    };
    reader.readAsDataURL(file);
  }
}

function comprimirImagen(src, calidad) {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    const max = 800;
    let w = img.width, h = img.height;
    if (w > max) { h = Math.round(h * max / w); w = max; }
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    imgBase64 = canvas.toDataURL('image/jpeg', calidad);
    mostrarPreview(imgBase64);
  };
  img.src = src;
}

function mostrarPreview(src) {
  const drop = document.getElementById('img-drop');
  drop.innerHTML = `<img src="${src}" alt="preview" />`;
}

async function agregar() {
  const monto = parseFloat(document.getElementById('inp-monto').value);
  const concepto = document.getElementById('inp-concepto').value.trim();
  const resp = document.getElementById('inp-resp').value.trim();
  const fecha = document.getElementById('inp-fecha').value;

  if (!monto || monto <= 0) { toast('Ingresa una cantidad válida'); return; }
  if (!concepto) { toast('Ingresa el concepto'); return; }

  let saldoPrev = 0;
  movimientos.forEach(m => { saldoPrev += m.tipo === 'ingreso' ? parseFloat(m.monto) : -parseFloat(m.monto); });
  const saldoDespues = tipoActual === 'ingreso' ? saldoPrev + monto : saldoPrev - monto;

  const mov = {
    id: Date.now(),
    tipo: tipoActual,
    monto: monto,
    concepto,
    responsable: resp || 'Sin especificar',
    fecha: fecha || new Date().toISOString().slice(0, 16),
    imagen: imgBase64 || '',
    saldoDespues
  };

  const btn = document.getElementById('btn-registrar');
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  setStatus('loading', 'Guardando...');

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'add', clave: CLAVE_CORRECTA, ...mov })
    });
    const json = await res.json();
    if (json.ok) {
      movimientos.unshift(mov);
      renderHistorial();
      recalcular();
      setStatus('ok', `Guardado · ${movimientos.length} registro(s)`);
      toast('✓ Movimiento registrado');
      limpiarForm();
    } else {
      setStatus('err', 'Error al guardar');
      toast('Error al guardar');
    }
  } catch(e) {
    setStatus('err', 'Sin conexión');
    toast('Error de conexión');
  }

  btn.disabled = false;
  btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Registrar movimiento';
}

async function eliminar(id) {
  if (!confirm('¿Eliminar este movimiento?')) return;
  setStatus('loading', 'Eliminando...');
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'delete', clave: CLAVE_CORRECTA, id })
    });
    const json = await res.json();
    if (json.ok) {
      movimientos = movimientos.filter(m => String(m.id) !== String(id));
      renderHistorial();
      recalcular();
      setStatus('ok', `Sincronizado · ${movimientos.length} registro(s)`);
      toast('Movimiento eliminado');
    }
  } catch(e) {
    setStatus('err', 'Error al eliminar');
  }
}

function limpiarForm() {
  document.getElementById('inp-monto').value = '';
  document.getElementById('inp-concepto').value = '';
  document.getElementById('inp-resp').value = '';
  document.getElementById('img-drop').innerHTML = `
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <span>Clic para añadir foto</span>`;
  document.getElementById('inp-img').value = '';
  imgBase64 = null;
  initFecha();
}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderHistorial() {
  const cont = document.getElementById('historial');
  if (!movimientos.length) {
    cont.innerHTML = '<div class="empty"><span class="empty-icon">📋</span>Aún no hay movimientos registrados</div>';
    return;
  }
  cont.innerHTML = movimientos.map(m => {
    const monto = parseFloat(m.monto) || 0;
    const saldo = parseFloat(m.saldoDespues) || 0;
    const thumbHtml = m.imagen ? `<img class="mov-thumb" src="${m.imagen}" alt="foto" onclick="verFoto('${m.id}')" />` : '';
    const fechaStr = (m.fecha || '').replace('T', ' ');
    return `<div class="mov ${m.tipo}">
      <div class="mov-ico ${m.tipo === 'retiro' ? 'r' : 'i'}">${m.tipo === 'retiro' ? '↑' : '↓'}</div>
      <div>
        <div class="mov-concepto">${esc(m.concepto)}</div>
        <div class="mov-meta">👤 ${esc(m.responsable)} &nbsp;·&nbsp; 🕐 ${fechaStr}</div>
        <div class="mov-saldo">Saldo tras mov.: ${fmt(saldo)}</div>
      </div>
      <div class="mov-right">
        <div class="mov-monto ${m.tipo === 'retiro' ? 'r' : 'i'}">${m.tipo === 'retiro' ? '-' : '+'}${fmt(monto)}</div>
        ${thumbHtml}
        <button class="btn-del" onclick="eliminar('${m.id}')" title="Eliminar">🗑</button>
      </div>
    </div>`;
  }).join('');
}

function verFoto(id) {
  const mov = movimientos.find(m => String(m.id) === String(id));
  if (!mov || !mov.imagen) return;
  document.getElementById('modal-img').src = mov.imagen;
  document.getElementById('modal-bg').classList.add('open');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
</body>
</html>
